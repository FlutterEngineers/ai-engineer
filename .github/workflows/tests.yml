
name: ML API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v
        
      - name: Run Ruff lint checks
        run: python -m ruff check api.py test_api.py smoke_test.py

      - name: Check Python formatting
        run: python -m ruff format --check api.py test_api.py smoke_test.py


 
  docker-build:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ml-prediction-api:ci .

      - name: Start Docker container
        run: docker run -d --name ml-api-ci -p 8000:8000 ml-prediction-api:ci

      - name: Verify API responds
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:8000/; then
              echo
              echo "API smoke test passed"
              exit 0
            fi
            sleep 2
          done

          docker logs ml-api-ci
          exit 1

      - name: Test prediction endpoint
        run: python smoke_test.py

      - name: Clean up container
        if: always()
        run: docker rm -f ml-api-ci || true
